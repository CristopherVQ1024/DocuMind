<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>DocuMind</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Sube tus PDF y pregúntales lo que necesites. Cada respuesta cita el documento y la página.">
  <meta name="theme-color" content="#f6f3e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16201b" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
  </script>
</head>

</body>
</html>
