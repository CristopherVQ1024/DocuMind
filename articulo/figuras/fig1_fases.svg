<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" font-family="Liberation Sans, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <rect width="1400" height="430" fill="#fff"/>

  <g>
    <rect x="20" y="20" width="305" height="390" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <rect x="20" y="20" width="305" height="62" rx="10" fill="#222"/>
    <rect x="20" y="62" width="305" height="20" fill="#222"/>
    <text x="40" y="50" font-size="15" fill="#bbb" font-weight="bold">FASE 1</text>
    <text x="40" y="72" font-size="22" fill="#fff" font-weight="bold">Corpus y vigencia</text>
    <g font-size="17" fill="#222">
      <text x="40" y="122">Compendio MTPE 2024</text>
      <text x="40" y="145" fill="#555">1 811 páginas</text>
      <text x="40" y="185">135 normas</text>
      <text x="40" y="208" fill="#555">3 476 artículos con</text>
      <text x="40" y="231" fill="#555">encabezado jerárquico</text>
      <text x="40" y="271">Notas editoriales</text>
      <text x="40" y="294" fill="#555">modificación y derogación</text>
    </g>
    <rect x="40" y="322" width="265" height="66" rx="8" fill="#e3edf9" stroke="#1f5fa8" stroke-width="2"/>
    <text x="172" y="350" font-size="17" fill="#1f5fa8" font-weight="bold" text-anchor="middle">Función σ(a, t)</text>
    <text x="172" y="374" font-size="15" fill="#1f5fa8" text-anchor="middle">estado en la fecha t</text>
  </g>

  <line x1="327" y1="215" x2="363" y2="215" stroke="#222" stroke-width="2.5" marker-end="url(#flecha)"/>

  <g>
    <rect x="365" y="20" width="305" height="390" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <rect x="365" y="20" width="305" height="62" rx="10" fill="#222"/>
    <rect x="365" y="62" width="305" height="20" fill="#222"/>
    <text x="385" y="50" font-size="15" fill="#bbb" font-weight="bold">FASE 2</text>
    <text x="385" y="72" font-size="22" fill="#fff" font-weight="bold">Benchmark</text>
    <g font-size="17" fill="#222">
      <text x="385" y="122">596 preguntas, 6 tipos</text>
      <text x="385" y="145" fill="#555">literal, temporal, rastreo,</text>
      <text x="385" y="168" fill="#555">multisalto, premisa falsa,</text>
      <text x="385" y="191" fill="#555">sin respuesta</text>
      <text x="385" y="231">Redacción</text>
      <text x="385" y="254" fill="#555">Gemini, GPT-OSS 20B, plantillas</text>
      <text x="385" y="294">Estado oro determinista</text>
    </g>
    <rect x="385" y="322" width="265" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="517" y="350" font-size="17" fill="#222" font-weight="bold" text-anchor="middle">Desarrollo 109</text>
    <text x="517" y="374" font-size="17" fill="#222" font-weight="bold" text-anchor="middle">Prueba 487</text>
  </g>

  <line x1="672" y1="215" x2="708" y2="215" stroke="#222" stroke-width="2.5" marker-end="url(#flecha)"/>

  <g>
    <rect x="710" y="20" width="305" height="390" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <rect x="710" y="20" width="305" height="62" rx="10" fill="#222"/>
    <rect x="710" y="62" width="305" height="20" fill="#222"/>
    <text x="730" y="50" font-size="15" fill="#bbb" font-weight="bold">FASE 3</text>
    <text x="730" y="72" font-size="22" fill="#fff" font-weight="bold">Sistemas</text>
    <g font-size="17" fill="#222">
      <text x="730" y="122">11 configuraciones</text>
      <text x="730" y="145" fill="#555">ingenuo, BM25, denso, híbrido,</text>
      <text x="730" y="168" fill="#555">reordenador, recencia,</text>
      <text x="730" y="191" fill="#555">réplica de Tacna ×2</text>
      <text x="730" y="231">Generadores locales</text>
      <text x="730" y="254" fill="#555">Llama 3.1 8B, Gemma 3 12B</text>
    </g>
    <rect x="730" y="282" width="265" height="106" rx="8" fill="#e3edf9" stroke="#1f5fa8" stroke-width="2"/>
    <text x="862" y="312" font-size="17" fill="#1f5fa8" font-weight="bold" text-anchor="middle">Propuesto</text>
    <text x="862" y="338" font-size="15" fill="#1f5fa8" text-anchor="middle">híbrido + reordenador</text>
    <text x="862" y="360" font-size="15" fill="#1f5fa8" text-anchor="middle">+ etiqueta de vigencia</text>
    <text x="862" y="382" font-size="15" fill="#1f5fa8" text-anchor="middle">+ compuerta τ</text>
  </g>

  <line x1="1017" y1="215" x2="1053" y2="215" stroke="#222" stroke-width="2.5" marker-end="url(#flecha)"/>

  <g>
    <rect x="1055" y="20" width="325" height="390" rx="10" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
    <rect x="1055" y="20" width="325" height="62" rx="10" fill="#222"/>
    <rect x="1055" y="62" width="325" height="20" fill="#222"/>
    <text x="1075" y="50" font-size="15" fill="#bbb" font-weight="bold">FASE 4</text>
    <text x="1075" y="72" font-size="22" fill="#fff" font-weight="bold">Evaluación</text>
    <g font-size="17" fill="#222">
      <text x="1075" y="122">Recuperación</text>
      <text x="1075" y="145" fill="#555">Recall@k, MRR@10, nDCG@10</text>
      <text x="1075" y="185">Generación</text>
      <text x="1075" y="208" fill="#555">citas, estado, anacronismo,</text>
      <text x="1075" y="231" fill="#555">rastreo, F1 de abstención</text>
      <text x="1075" y="271">Juez GPT-OSS 20B y experto</text>
      <text x="1075" y="294" fill="#555">κ ponderado cuadrático</text>
    </g>
    <rect x="1075" y="322" width="285" height="66" rx="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1217" y="350" font-size="17" fill="#222" font-weight="bold" text-anchor="middle">Wilcoxon, McNemar</text>
    <text x="1217" y="374" font-size="15" fill="#222" text-anchor="middle">bootstrap 95 %, Holm</text>
  </g>
</svg>
