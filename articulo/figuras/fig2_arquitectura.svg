  <line x1="720" y1="430" x2="720" y2="378" stroke="#222" stroke-width="2" marker-end="url(#f)"/>

  <line x1="600" y1="330" x2="553" y2="330" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <rect x="330" y="285" width="220" height="90" rx="8" fill="#f4f4f4" stroke="#222" stroke-width="2"/>
  <text x="440" y="320" font-size="18" fill="#222" font-weight="bold" text-anchor="middle">Generador</text>
  <text x="440" y="343" font-size="15" fill="#555" text-anchor="middle">Llama 3.1 8B</text>
  <text x="440" y="362" font-size="15" fill="#555" text-anchor="middle">Gemma 3 12B</text>

  <line x1="330" y1="330" x2="283" y2="330" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <rect x="20" y="260" width="260" height="140" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="150" y="290" font-size="18" fill="#222" font-weight="bold" text-anchor="middle">Salida JSON</text>
  <g font-size="15" fill="#555">
    <text x="42" y="318">respuesta</text>
    <text x="42" y="340">pasajes citados</text>
    <text x="42" y="362">estado</text>
    <text x="42" y="384">norma modificatoria</text>
