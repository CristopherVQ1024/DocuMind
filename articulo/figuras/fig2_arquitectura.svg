  <text x="980" y="348" font-size="16" fill="#1f5fa8" text-anchor="middle">s₁ &lt; τ</text>

  <rect x="1170" y="295" width="200" height="70" rx="8" fill="#fff" stroke="#222" stroke-width="2"/>
