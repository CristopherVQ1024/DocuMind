    <polyline points="400,110 420,110 420,70 437,70" marker-end="url(#f)"/>
    <polyline points="420,110 420,150 437,150" marker-end="url(#f)"/>
    <polyline points="630,70 650,70 650,110 667,110" marker-end="url(#f)"/>
