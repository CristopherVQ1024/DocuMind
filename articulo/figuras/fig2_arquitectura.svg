  <rect x="20" y="440" width="530" height="62" rx="8" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="285" y="466" font-size="15" fill="#333" text-anchor="middle">Variante con estado determinista: el estado se toma</text>
  <text x="285" y="488" font-size="15" fill="#333" text-anchor="middle">de σ(a, t) del primer artículo citado</text>
  <line x1="150" y1="440" x2="150" y2="403" stroke="#555" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#f)"/>
</svg>
