  <text x="1270" y="349" font-size="14" fill="#555" text-anchor="middle">sin llamar al generador</text>
  <line x1="1090" y1="330" x2="1167" y2="330" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
  <text x="1120" y="320" font-size="16" fill="#222">sí</text>

  <line x1="870" y1="330" x2="843" y2="330" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
